{% extends "layout/basic.html" %}
{% block content %}
<div class="row"><div class="columns">
  <div class="section cug-auth-section">
    <div class="section__body">
      <div class="cug-auth-head">
        <img src="{{ UiContext.cdn_prefix }}stamp.png?v=20261114" width="48" height="48" alt="CUGACM">
        <h1>{{ _('Sign Up') }}</h1>
      </div>
      <form method="POST">
        <div class="cug-auth-field">
          <label for="regc-mail">{{ _('Email') }}</label>
          <input id="regc-mail" type="text" class="textbox" value="{{ mail }}" disabled>
        </div>
        <div class="cug-auth-field">
          <label for="regc-uname">{{ _('Username') }}</label>
          <input id="regc-uname" name="uname" value="{{ username or '' }}" type="text" class="textbox" {% if lockUsername %}readonly{% else %}autofocus{% endif %}>
        </div>
        <div class="cug-auth-field">
          <label for="regc-pass">{{ _('Password') }}</label>
          <input id="regc-pass" name="password" type="password" class="textbox" {% if lockUsername %}autofocus{% endif %}>
        </div>
        <div class="cug-auth-field">
          <label for="regc-vpass">{{ _('Repeat Password') }}</label>
          <input id="regc-vpass" name="verifyPassword" type="password" class="textbox">
        </div>
        <div class="cug-auth-submit">
          <input type="submit" value="{{ _('user_register') }}" class="expanded primary button">
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
