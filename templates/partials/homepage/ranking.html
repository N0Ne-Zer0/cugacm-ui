{% if payload.length %}
  <div class="section side cug-home-ranking">
    <div class="section__header">
      <h1 class="section__title">{{ _('Ranking') }}</h1>
    </div>
    <ol class="cug-rank-list">
      {%- for uid in payload -%}
        {% set udoc = udict[uid] %}
        <li class="cug-rank-item">
          <span class="cug-rank-no{% if loop.index <= 3 %} cug-rank-no--{{ loop.index }}{% endif %}">{{ loop.index }}</span>
          <a class="cug-rank-name" href="{{ url('user_detail', uid=udoc._id) }}" title="{{ udoc.uname }}">{{ udoc.uname }}</a>
          <span class="cug-rank-rp">{{ udoc.rp|default(0)|round(0) }}</span>
        </li>
      {%- endfor -%}
    </ol>
    <ul class="pager pager-bottom"><li>
      <a class="pager__item next link" href="{{ url('ranking') }}">{{ _('More') }} ></a>
    </li></ul>
  </div>
{% endif %}
