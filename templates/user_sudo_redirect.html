{% extends "layout/basic.html" %}
{% block content %}
<div class="row"><div class="columns">
  <div class="section cug-auth-section">
    <div class="section__body">
      <div class="cug-auth-head">
        <img src="{{ UiContext.cdn_prefix }}stamp.png?v=20261114" width="48" height="48" alt="CUGACM">
        <h1>{{ _('Confirm Access') }}</h1>
        <p>Redirecting, please wait...</p>
      </div>
      <form method="{{ method }}" action="{{ redirect }}" style="visibility:hidden;height:0;overflow:hidden;">
        {% for k, v in args %}
          <input name="{{ k }}" value="{{ v }}" />
        {% endfor %}
        <input type="submit" id="submit" />
      </form>
      <script>document.getElementById('submit').click()</script>
    </div>
  </div>
</div></div>
{% endblock %}
