{% extends "layout/basic.html" %}
{% block content %}
<div class="row"><div class="columns">
  <div class="section cug-auth-section">
    <div class="section__body">
      <div class="cug-auth-head">
        <img src="{{ UiContext.cdn_prefix }}stamp.png?v=20261114" width="48" height="48" alt="CUGACM">
        <h1>{{ _('Done') }}</h1>
      </div>
      <div class="cug-auth-notice">
        {{ _('Your account will be deleted in 7 days.') }}
        {{ _('You can cancel this at user setting page.') }}
      </div>
      <div class="cug-auth-submit">
        <a href="{{ url('home_settings', category='account') }}" class="expanded primary button">{{ _('home_account') }}</a>
      </div>
    </div>
  </div>
</div></div>
{% endblock %}
