{% extends "layout/basic.html" %}
{% block content %}
<div class="row"><div class="columns">
  <div class="section cug-auth-section">
    <div class="section__body">
      <div class="cug-auth-head">
        <img src="{{ UiContext.cdn_prefix }}stamp.png?v=20261114" width="48" height="48" alt="CUGACM">
        <h1>{{ _('Lost Password') }}</h1>
      </div>
      <form method="POST">
        <div class="cug-auth-field">
          <label for="lp-uname">{{ _('Username') }}</label>
          <input id="lp-uname" type="text" class="textbox" value="{{ uname }}" disabled>
        </div>
        <div class="cug-auth-field">
          <label for="lp-pass">{{ _('Password') }}</label>
          <input id="lp-pass" name="password" type="password" class="textbox" autofocus>
        </div>
        <div class="cug-auth-field">
          <label for="lp-vpass">{{ _('Repeat Password') }}</label>
          <input id="lp-vpass" name="verifyPassword" type="password" class="textbox">
        </div>
        <div class="cug-auth-submit">
          <input type="submit" value="{{ _('Reset Password') }}" class="expanded primary button">
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
